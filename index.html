
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOGE Carwash & Food</title>
<style>
body{font-family:Arial,sans-serif;background:#101820;color:white;text-align:center;padding:20px}
.card{max-width:440px;margin:24px auto;padding:22px;background:#202b35;border-radius:18px}
input,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border:0;border-radius:9px;font-size:16px}
button{background:#e4b34c;color:#101820;font-weight:bold;cursor:pointer}
.secondary{background:#cbd5df}
.cancel{background:#b84b4b;color:white}
.muted{color:#cbd5df}
.member{background:#101820;border:1px solid #e4b34c;border-radius:12px;padding:14px;margin-top:14px;text-align:left;overflow-wrap:anywhere}
.nomor{color:#e4b34c;font-size:24px;font-weight:bold;text-align:center}
.entry{border-bottom:1px solid #394653;padding:10px 0}
.small{font-size:13px;color:#cbd5df}
</style>
</head>
<body>
<div class="card">
  <h1>MOGE</h1>
  <h2>Carwash &amp; Food</h2>
  <p class="muted">Kartu Loyalitas Pelanggan</p>

  <input id="nama" placeholder="Nama pelanggan">
  <input id="plat" placeholder="Nomor polisi kendaraan">
  <input id="telepon" type="tel" placeholder="Nomor WhatsApp">
  <button onclick="daftar()">Daftar / Cari Member</button>
  <div id="hasil" aria-live="polite"></div>

  <p class="muted">10 kali cuci berbayar = 1 kali cuci gratis.</p>
  <p class="muted">Garansi Hujan — S&amp;K berlaku.</p>
</div>

<script>
const KEY_DATA='moge_loyalty_members_v1';
const KEY_NEXT='moge_loyalty_next_number_v1';
let memberAktif=null;

function bacaData(){
  try{
    const data=JSON.parse(localStorage.getItem(KEY_DATA)||'[]');
    if(!Array.isArray(data))return [];
    data.forEach(m=>{
      if(!Array.isArray(m.riwayat))m.riwayat=[];
      if(!Array.isArray(m.hadiah)){
        m.hadiah=[];
        for(let i=0;i<(m.gratisTersedia||0);i++){
          m.hadiah.push({id:'lama-'+m.nomor+'-'+i,status:'tersedia',tanggal:null});
        }
      }
      if(typeof m.jumlahCuci!=='number')m.jumlahCuci=0;
      if(typeof m.totalKlaim!=='number')m.totalKlaim=0;
      m.gratisTersedia=m.hadiah.filter(h=>h.status==='tersedia').length;
    });
    return data;
  }catch{return []}
}
function simpan(data){
  localStorage.setItem(KEY_DATA,JSON.stringify(data));
}
function tanggal(waktu=new Date()){
  return new Date(waktu).toLocaleString('id-ID',{
    day:'2-digit',month:'long',year:'numeric',
    hour:'2-digit',minute:'2-digit'
  });
}
function daftar(){
  const nama=document.getElementById('nama').value.trim();
  const plat=document.getElementById('plat').value.trim().toUpperCase();
  const telepon=document.getElementById('telepon').value.trim();
  if(!telepon){alert('Masukkan nomor WhatsApp untuk mencari member atau mendaftar.');return}

  const anggota=bacaData();
  let m=anggota.find(x=>x.telepon===telepon);

  if(!m){
    if(!nama||!plat){alert('Member baru harus mengisi nama, nomor polisi, dan WhatsApp.');return}
    let n=Number(localStorage.getItem(KEY_NEXT)||'1');
    if(!Number.isSafeInteger(n)||n<1)n=1;
    m={
      nomor:'MOGE-'+String(n).padStart(5,'0'),
      nama,plat,telepon,jumlahCuci:0,
      gratisTersedia:0,totalKlaim:0,
      hadiah:[],riwayat:[],
      tanggalDaftar:new Date().toISOString()
    };
    anggota.push(m);
    try{
      localStorage.setItem(KEY_NEXT,String(n+1));
      simpan(anggota);
    }catch(e){alert('Data gagal disimpan. Periksa ruang penyimpanan browser.');return}
  }else{
    if(nama)m.nama=nama;
    if(plat)m.plat=plat;
    try{simpan(anggota)}catch(e){}
  }
  memberAktif=m.nomor;
  tampilkan(m);
}
function cariAktif(){
  const anggota=bacaData();
  return {anggota,m:anggota.find(x=>x.nomor===memberAktif)};
}
function tambahCuci(){
  const {anggota,m}=cariAktif();
  if(!m)return;
  if(!confirm('Catat 1 kali cuci berbayar untuk '+m.nama+'?'))return;

  const id='CUCI-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
  const transaksi={
    id,jenis:'Cuci berbayar',status:'berhasil',
    tanggal:new Date().toISOString(),hadiahId:null
  };
  m.jumlahCuci++;

  if(m.jumlahCuci>=10){
    m.jumlahCuci=0;
    const hadiahId='HADIAH-'+id;
    transaksi.hadiahId=hadiahId;
    m.hadiah.push({id:hadiahId,status:'tersedia',tanggal:new Date().toISOString()});
    alert('Selamat! Member mendapatkan 1 kali cuci gratis.');
  }
  m.riwayat.unshift(transaksi);
  m.gratisTersedia=m.hadiah.filter(h=>h.status==='tersedia').length;

  try{simpan(anggota);tampilkan(m)}
  catch(e){alert('Gagal menyimpan data.')}
}
function gunakanGratis(hadiahId){
  const {anggota,m}=cariAktif();
  if(!m)return;
  const h=m.hadiah.find(x=>x.id===hadiahId&&x.status==='tersedia');
  if(!h){alert('Kupon gratis tidak tersedia.');return}
  if(!confirm('Konfirmasi penggunaan 1 kali cuci gratis?'))return;

  h.status='diklaim';
  h.tanggal=new Date().toISOString();
  m.totalKlaim++;
  m.riwayat.unshift({
    id:'KLAIM-'+Date.now(),jenis:'Klaim cuci gratis',
    status:'berhasil',tanggal:new Date().toISOString(),
    hadiahId:h.id
  });
  m.gratisTersedia=m.hadiah.filter(x=>x.status==='tersedia').length;
  try{simpan(anggota);tampilkan(m)}
  catch(e){alert('Gagal menyimpan klaim.')}
}
function batalkan(id){
  const {anggota,m}=cariAktif();
  if(!m)return;
  const t=m.riwayat.find(x=>x.id===id&&x.jenis==='Cuci berbayar'&&x.status==='berhasil');
  if(!t)return;

  const transaksiAktif=m.riwayat.find(x=>x.jenis==='Cuci berbayar'&&x.status==='berhasil');
  if(!transaksiAktif||transaksiAktif.id!==id){
    alert('Untuk menjaga hitungan hadiah tetap benar, hanya transaksi cuci terakhir yang dapat dibatalkan.');
    return;
  }

  const hadiah=t.hadiahId?m.hadiah.find(x=>x.id===t.hadiahId):null;
  if(hadiah&&hadiah.status==='diklaim'){
    alert('Transaksi ini sudah menghasilkan hadiah yang diklaim. Hubungi admin untuk koreksi.');
    return;
  }
  if(!confirm('Batalkan transaksi cuci tanggal '+tanggal(t.tanggal)+'? Riwayat pembatalan tetap disimpan.'))return;

  t.status='dibatalkan';
  t.tanggalBatal=new Date().toISOString();

  if(hadiah&&hadiah.status==='tersedia'){
    m.hadiah=m.hadiah.filter(x=>x.id!==hadiah.id);
    m.jumlahCuci=9;
  }else{
    m.jumlahCuci=Math.max(0,m.jumlahCuci-1);
  }
  m.gratisTersedia=m.hadiah.filter(x=>x.status==='tersedia').length;
  try{simpan(anggota);tampilkan(m)}
  catch(e){alert('Gagal menyimpan pembatalan.')}
}
function tampilkan(m){
  const hasil=document.getElementById('hasil');
  hasil.replaceChildren();
  const box=document.createElement('div');
  box.className='member';
  function teks(s,kelas){
    const p=document.createElement('p');
    p.textContent=s;
    if(kelas)p.className=kelas;
    box.appendChild(p);
  }
  teks('KARTU MEMBER','small');
  teks(m.nomor,'nomor');
  teks('Nama: '+m.nama);
  teks('Nomor polisi: '+m.plat);
  teks('WhatsApp: '+m.telepon);
  teks('Progres cuci: '+m.jumlahCuci+'/10 kali');
  teks('Cuci gratis tersedia: '+m.hadiah.filter(h=>h.status==='tersedia').length);
  teks('Total klaim cuci gratis: '+m.totalKlaim);

  const tambah=document.createElement('button');
  tambah.textContent='Tambah 1 Kali Cuci';
  tambah.onclick=tambahCuci;
  box.appendChild(tambah);

  const sub=document.createElement('h3');
  sub.textContent='Kupon Cuci Gratis';
  box.appendChild(sub);
  const hadiahTersedia=m.hadiah.filter(h=>h.status==='tersedia');
  if(!hadiahTersedia.length)teks('Belum ada kupon gratis tersedia.','small');
  hadiahTersedia.forEach(h=>{
    const b=document.createElement('button');
    b.className='secondary';
    b.textContent='Klaim 1 Cuci Gratis';
    b.onclick=()=>gunakanGratis(h.id);
    box.appendChild(b);
  });

  const judul=document.createElement('h3');
  judul.textContent='Riwayat Cuci dan Klaim';
  box.appendChild(judul);
  if(!m.riwayat.length)teks('Belum ada riwayat transaksi.','small');

  m.riwayat.forEach(t=>{
    const e=document.createElement('div');
    e.className='entry';
    const p=document.createElement('p');
    p.textContent=t.jenis+' — '+t.status;
    e.appendChild(p);
    const d=document.createElement('p');
    d.className='small';
    d.textContent='Tanggal: '+tanggal(t.tanggal);
    e.appendChild(d);
    if(t.tanggalBatal){
      const b=document.createElement('p');
      b.className='small';
      b.textContent='Dibatalkan: '+tanggal(t.tanggalBatal);
      e.appendChild(b);
    }
    if(t.jenis==='Cuci berbayar'&&t.status==='berhasil'){
      const b=document.createElement('button');
      b.className='cancel';
      b.textContent='Batalkan Cuci Ini';
      b.onclick=()=>batalkan(t.id);
      e.appendChild(b);
    }
    box.appendChild(e);
  });
  hasil.appendChild(box);
}
</script>
</body>
</html>
